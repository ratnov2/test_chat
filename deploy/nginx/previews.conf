server {
  listen 80;
  server_name preview.margaretti.space ~^.+\.preview\.margaretti\.space$;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name "~^(?<project>[a-z0-9-]+)-(?<sha>[0-9a-f]{7})\.preview\.margaretti\.space$";

  ssl_certificate /etc/letsencrypt/live/preview.margaretti.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/preview.margaretti.space/privkey.pem;

  auth_basic "Previews";
  auth_basic_user_file /etc/nginx/previews.htpasswd;

  root /srv/previews/$project/$sha;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Robots-Tag "noindex, nofollow" always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location / {
    try_files $uri /index.html;
  }
}

server {
  listen 443 ssl http2;
  server_name preview.margaretti.space;

  ssl_certificate /etc/letsencrypt/live/preview.margaretti.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/preview.margaretti.space/privkey.pem;

  auth_basic "Previews";
  auth_basic_user_file /etc/nginx/previews.htpasswd;

  root /srv/previews-ui;
  index index.html;

  add_header X-Robots-Tag "noindex, nofollow" always;

  location = /manifest.json {
    alias /srv/previews/manifest.json;
    default_type application/json;
    add_header Cache-Control "no-store";
  }
}
