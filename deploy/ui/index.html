<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Previews</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f4f5; --card: #fff; --text: #000; --muted: #707579; --accent: #3390ec; --line: #dfe1e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #181818; --card: #212121; --text: #fff; --muted: #aaa; --accent: #8774e1; --line: #0f0f0f; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.3125 Roboto, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 24px; font-weight: 500; margin: 0 0 16px; }
      select { width: 100%; height: 3rem; padding: 0 1rem; border: 2px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text); font: inherit; margin-bottom: 16px; }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      a { display: block; padding: 12px 16px; background: var(--card); border-radius: 12px; color: inherit; text-decoration: none; }
      a:hover { outline: 2px solid var(--accent); }
      .row { display: flex; gap: 12px; align-items: baseline; }
      .sha { font-family: 'Roboto Mono', monospace; color: var(--accent); }
      .branch { font-weight: 500; }
      .date { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
      .msg { color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .empty { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Previews</h1>
      <select id="project"></select>
      <ul id="list"></ul>
    </main>
    <script>
      const select = document.getElementById('project')
      const list = document.getElementById('list')
      let manifest = {}

      const el = (tag, className, text) => {
        const node = document.createElement(tag)
        if (className) node.className = className
        if (text !== undefined) node.textContent = text
        return node
      }

      const render = () => {
        const project = select.value
        const commits = manifest[project] ?? []
        list.replaceChildren()
        if (!commits.length) return list.append(el('li', 'empty', 'Нет сборок'))
        for (const c of commits) {
          const a = el('a')
          a.href = `https://${project}-${c.sha}.${location.host}/`
          const row = el('div', 'row')
          row.append(
            el('span', 'sha', c.sha),
            el('span', 'branch', c.branch),
            el('span', 'date', new Date(c.date).toLocaleString()),
          )
          a.append(row, el('div', 'msg', c.message))
          const li = el('li')
          li.append(a)
          list.append(li)
        }
        history.replaceState(null, '', `#${project}`)
      }

      fetch('/manifest.json', { cache: 'no-store' })
        .then((r) => r.json())
        .then((data) => {
          manifest = data
          const projects = Object.keys(data).sort()
          select.replaceChildren(...projects.map((p) => Object.assign(el('option', '', p), { value: p })))
          const wanted = decodeURIComponent(location.hash.slice(1))
          if (projects.includes(wanted)) select.value = wanted
          render()
        })
        .catch(() => list.append(el('li', 'empty', 'Не удалось загрузить manifest.json')))

      select.addEventListener('change', render)
    </script>
  </body>
</html>
